name: chronicle

services:
  chronicle:
    image: ${CHRONICLE_IMAGE:-chronicle:local}
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        GO_VERSION: ${GO_VERSION:-1.26}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.23}
    restart: unless-stopped
    init: true
    user: '${CHRONICLE_UID:-1000}:${CHRONICLE_GID:-1000}'
    env_file:
      - path: ${CHRONICLE_ENV_FILE:-.env}
        required: false
    ports:
      - '${CHRONICLE_BIND:-127.0.0.1}:${CHRONICLE_PORT:-8080}:${CHRONICLE_CONTAINER_PORT:-8080}'
    volumes:
      - type: bind
        source: ${CHRONICLE_WORKSPACE_HOST:-./.chronicle}
        target: /data
        bind:
          create_host_path: false
      - ${CHRONICLE_CONFIG_FILE:-./config/docker.json}:/etc/chronicle/config.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    stop_grace_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles:
      - postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chronicle}
      POSTGRES_USER: ${POSTGRES_USER:-chronicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronicle}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles:
      - ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0:11434}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres:
  ollama:
